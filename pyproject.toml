[project]
name = "lumen-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tawanda", email = "ejmunongo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=6.1.1",
    "django-cotton>=2.7.2",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "nh3>=0.3.7",
]

[project.scripts]
lumen-django = "lumen_django:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
