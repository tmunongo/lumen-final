<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Lumen Space</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/application.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-bg">
    <div class="auth-bg__grid"></div>
    <div class="auth-bg__glow auth-bg__glow--1"></div>
    <div class="auth-bg__glow auth-bg__glow--2"></div>
  </div>

  <div class="auth-card">
    <div class="auth-card__glow-bar"></div>
    
    <div class="auth-card__header">
      <div class="auth-brand-badge">
        <span class="auth-brand-badge__icon">◉</span>
        <span class="auth-brand-badge__pulse"></span>
      </div>
      <h1 class="auth-card__title">Lumen Space</h1>
      <p class="auth-card__subtitle">Sign in to your research workspace</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="auth-alert auth-alert--{{ message.tags }}" role="alert">
          <span class="auth-alert__text">{{ message }}</span>
        </div>
      {% endfor %}
    {% endif %}

    {% if error %}
      <div class="auth-alert auth-alert--error" role="alert">
        <span class="auth-alert__text">{{ error }}</span>
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}{% if request.GET.return_to %}?return_to={{ request.GET.return_to }}{% endif %}" class="auth-form">
      {% csrf_token %}
      <div class="auth-field">
        <label for="username" class="auth-field__label">
          <span>Username</span>
        </label>
        <div class="auth-input-group">
          <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input type="text" name="username" id="username" class="auth-input" value="{{ request.POST.username|default:'lumen' }}" placeholder="Username" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="auth-field" x-data="{ show: false }">
        <div class="auth-field__header">
          <label for="password" class="auth-field__label">
            <span>Password</span>
          </label>
        </div>
        <div class="auth-input-group">
          <svg class="auth-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input :type="show ? 'text' : 'password'" name="password" id="password" class="auth-input auth-input--has-toggle" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="auth-password-toggle" @click="show = !show" aria-label="Toggle password visibility" tabindex="-1">
            <svg x-show="!show" class="icon-eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg x-show="show" class="icon-eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-submit-btn">
        <span>Sign in to workspace</span>
        <svg class="auth-submit-btn__arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="auth-card__hint">
      <span class="auth-hint-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Default credentials: <code>lumen</code> / <code>lumen</code></span>
      </span>
    </div>

    <div class="auth-card__footer">
      <span class="auth-card__footer-text">Lumen Space &bull; Deep Research & Structured Thinking</span>
    </div>
  </div>
</div>
</body>
</html>
