<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Lumen Space{% endblock %}</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link rel="stylesheet" href="/static/css/application.css">
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="app-body" x-data="{ addModalOpen: false, exportModalOpen: false }">
  <c-flash />
  
  <header class="app-header">
    <div class="app-header__left">
      <a href="{% url 'projects_index' %}" class="brand-logo">
        <span class="brand-logo__icon">◉</span>
        <span class="brand-logo__text">Lumen Space</span>
      </a>
    </div>
    
    <div class="app-header__right">
      {% if user.is_authenticated or request.session.authenticated %}
        <span class="user-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          {{ request.session.username|default:"lumen" }}
        </span>
        <a href="{% url 'logout' %}" class="btn-icon-text text-muted" title="Sign Out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </a>
      {% endif %}
    </div>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
